[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stocks"
version = "0.1.0"
description = "Fetch and analyse daily stock prices from the command line."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.40"]

[project.scripts]
stocks = "stocks.cli:main"

[tool.setuptools]
packages = ["stocks"]
