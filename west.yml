# West manifest for the VL53L9CX occupancy node.
#
# T2 ("star") topology: this repository is the manifest repository and pulls in
# nRF Connect SDK, which in turn pulls Zephyr and the rest.
#
# ---------------------------------------------------------------------------
# Pinned to nRF Connect SDK v3.3.0 — the version Victor has installed
# (confirmed 2026-09-04). Do not float it: a silent SDK bump changes timing and
# power behaviour that the paper reports. Record any change in DECISIONS.md.
#
# NOTE: this pin and `water_sense_board` are currently INCOMPATIBLE. The board
# files are written against the nRF54L15 preview generation (hardware-model v1,
# `nordic/nrf54L15_M33.dtsi`, `SOC_NRF54L15_M33`), none of which exists in an
# NCS 3.x tree. The board files are Victor's and are not Claude's to change —
# see docs/hardware/water-sense-board-review.md for exactly what has to move.
# ---------------------------------------------------------------------------

manifest:
  version: "0.13"

  remotes:
    - name: nrfconnect
      url-base: https://github.com/nrfconnect

  projects:
    - name: nrf
      remote: nrfconnect
      repo-path: sdk-nrf
      revision: v3.3.0
      import: true

  self:
    path: radar_sensor_evaluation
