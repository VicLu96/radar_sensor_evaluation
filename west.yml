# West manifest for the VL53L9CX occupancy node.
#
# T2 ("star") topology: this repository is the manifest repository and pulls in
# nRF Connect SDK, which in turn pulls Zephyr and the rest.
#
# ---------------------------------------------------------------------------
# VERIFY THE REVISION BELOW BEFORE THE FIRST BUILD.
#
# This was written 2026-09-01 on a machine with no SDK installed, so the pin is
# a starting point rather than a tested one. Set it to the nRF Connect SDK
# version you actually have, and record the change in DECISIONS.md — the repo
# convention is that the SDK version is pinned, not floating, because a silent
# SDK bump changes timing and power behaviour that the paper reports.
#
# The nRF54L15 needs a reasonably recent SDK. If the build cannot find
# nrf54l15_cpuapp.dtsi, the pin is too old.
# ---------------------------------------------------------------------------

manifest:
  version: "0.13"

  remotes:
    - name: nrfconnect
      url-base: https://github.com/nrfconnect

  projects:
    - name: nrf
      remote: nrfconnect
      repo-path: sdk-nrf
      revision: v2.9.0
      import: true

  self:
    path: radar_sensor_evaluation
