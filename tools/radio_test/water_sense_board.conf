# Nordic's radio_test sample, on water_sense_board, over RTT.
#
# WHY THIS EXISTS. On 2026-09-11 four different advertising configurations —
# legacy connectable, legacy non-connectable, extended connectable, extended
# non-connectable — all reported success and none reached the air, while the
# same radio RECEIVED at -42 dBm. At that point the question is no longer about
# our firmware, and no amount of reading our code can answer it.
#
# radio_test is Nordic's own tool. It drives the RADIO peripheral directly and
# uses NONE of our code, none of the Bluetooth host, and none of the
# SoftDevice Controller's advertising machinery. If its continuous carrier is
# detectable, this SoC can transmit and the fault is in the BLE stack or its
# configuration. If it is not, the transmit path is broken below all software,
# and that is a hardware result.
#
# This board has no UART pins, so the shell goes over RTT — the same channel
# everything else uses. Open it with JLinkRTTViewer, or `west attach`.
#
# USAGE, once flashed and RTT is open:
#
#   start_tx_carrier            continuous unmodulated carrier
#   parameters_print            what it is about to do
#   start_channel 40            2440 MHz, mid-band and away from Wi-Fi 1/6/11
#   start_tx_carrier
#   cancel                      stop
#
# Then look for a peak at 2440 MHz on a spectrum analyser. ETH will have one,
# and this is the measurement that settles it.
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_SHELL_BACKEND_SERIAL=n

CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_SHELL_BACKEND_RTT=y

# The shell needs more room than the sample's default once RTT is the backend.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=4096

# Memory protection off, matching firmware_test — Victor, 2026-09-04.
CONFIG_ARM_MPU=n
CONFIG_HW_STACK_PROTECTION=n
