# Zephyr's own `beacon` sample on water_sense_board, console over RTT.
#
# WHY. Our firmware is ~3,000 lines across four GATT services, a streaming
# thread, a sensor driver and a staged bring-up. The beacon sample is about
# forty lines: it advertises non-connectably and does nothing else. It shares
# NONE of our code.
#
#   beacon is visible      -> our application is at fault, and the fault is
#                             somewhere in those 3,000 lines. That is a real
#                             result and a tractable search.
#   beacon is invisible    -> our code is exonerated completely. Nothing we
#                             write will fix this, and the question moves to
#                             the controller, the board or the module.
#
# This is the same logic as tools/radio_test, but it stays inside BLE and
# produces something a phone can actually see - no spectrum analyser, no
# antenna access.
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_ARM_MPU=n
CONFIG_HW_STACK_PROTECTION=n
