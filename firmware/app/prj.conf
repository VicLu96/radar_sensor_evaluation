# Bring-up application for the VL53L9CX node.

CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_PWM=y

# The driver models SUSPEND and TURN_OFF as distinct actions, which is the
# whole point of the stage-4 energy sweep. Without PM_DEVICE they collapse.
CONFIG_PM_DEVICE=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_VL53L9CX_LOG_LEVEL_INF=y
CONFIG_VL53L9CX_LOG_BOOT_TIME=y

# struct vl53l9cx_frame is ~18 KB and the driver holds a 14,842-byte raw
# buffer, but both are static rather than on a stack, so this is ordinary.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=1024

CONFIG_CBPRINTF_FP_SUPPORT=y
