# Zephyr's beacon sample, unmodified, on water_sense_board.
#
# WHY THIS IS A SEPARATE APPLICATION. On 2026-09-11 the real firmware reported
# itself advertising on every heartbeat - bt_le_adv_start returning -EALREADY,
# the controller confirming +8 dBm, every HCI command status 0x00 - while no
# scanner could see it. Four advertising configurations were tried (legacy and
# extended, connectable and non-connectable) and none reached the air, while
# the same radio RECEIVED 61-89 advertisements per run at -40 dBm.
#
# src/main.c here is Zephyr's own beacon sample, copied verbatim. About forty
# lines: advertise non-connectably, do nothing else. It shares NONE of the real
# firmware's ~3,000 lines - no GATT services, no streaming thread, no sensor
# driver, no staged bring-up.
#
#   "Test beacon" VISIBLE   -> the fault is in OUR application, and that is a
#                              tractable search through code we control.
#   "Test beacon" INVISIBLE -> our code is exonerated. Nothing we write will
#                              fix it, and the question is the controller, the
#                              board or the module.
#
# Drawing that line is the single most useful thing left to do.

# --- the sample's own three lines ---
CONFIG_BT=y
CONFIG_LOG=y
CONFIG_BT_DEVICE_NAME="Test beacon"

# --- this board has no UART pins, so console and log go over RTT ---
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_MODE_IMMEDIATE=y

# --- matched to the real firmware so this is not a second variable ---
# Memory protection off (Victor, 2026-09-04) and the same +8 dBm transmit power
# the real firmware now uses. Everything else is left at Zephyr's defaults on
# purpose: the point of this build is to be as close to the stock sample as the
# board allows.
CONFIG_ARM_MPU=n
CONFIG_HW_STACK_PROTECTION=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
