# Board bring-up test: prove the MCU runs and can talk to us.

# Console over SEGGER RTT. No UART pins are assigned on this board, and RTT
# works over the J-Link that is attached for flashing anyway — so this costs no
# pins and no board changes.
#
# To watch it:  west build ... && west flash && JLinkRTTViewer
# (or `west attach` / `JLinkRTTLogger` — anything that opens RTT channel 0)
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n

CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
# Immediate mode: log lines appear as they happen rather than via a deferred
# thread. Slower, and exactly what is wanted when the question is "does it get
# this far before it dies".
CONFIG_LOG_MODE_IMMEDIATE=y

# RTT must not drop messages during bring-up.
#
# The 2026-09-06 capture lost the whole I2C probe: the log cut off mid-line at
# 502 ms and resumed at heartbeat 2, 5.2 seconds later. That is the default
# 1 KB up-buffer overflowing against RTT's default drop-on-full, and the
# messages it ate were the ones that say whether the sensor answered.
#
# Block instead of dropping, and give it room. The block is bounded — RETRY_CNT
# attempts RETRY_DELAY_MS apart, then it gives up — so a board running with no
# viewer attached stalls for at most 20 ms per message rather than forever.
CONFIG_LOG_BACKEND_RTT_MODE_BLOCK=y
CONFIG_LOG_BACKEND_RTT_RETRY_CNT=4
CONFIG_LOG_BACKEND_RTT_RETRY_DELAY_MS=5
# SEGGER_RTT_BUFFER_SIZE_UP is the one that matters: the RTT backend uses
# buffer 0, the console buffer, so LOG_BACKEND_RTT_BUFFER_SIZE does not apply.
# 16 KB, not 4 KB. The failing bring-up ladder emits several kilobytes in one
# burst at POST_KERNEL, and Zephyr's RTT backend latches host_present=false once
# a write exhausts its retries (log_backend_rtt.c:178-186), after which every
# subsequent message is dropped instantly and silently. A bigger buffer makes
# that less likely; it does not make it impossible, which is why the real fix is
# vl53l9cx_retry_boot() from main() rather than any amount of tuning here.

CONFIG_GPIO=y

# I2C, shared by the LSM6DSV..BX IMU at 0x6B and the VL53L9CX at 0x29.
CONFIG_I2C=y

# The IMU is not fitted at the moment (Victor, 2026-09-05). Set back to y when
# it is — the code stays compiled-out rather than deleted.
#
# Note what this costs: the IMU was the only other device on this bus, so while
# it answered it proved the bus independently of the VL53L9CX. With it gone, a
# silent ToF sensor could be a bus fault just as easily as a sensor fault.
# IMU refitted 2026-09-10, so the stage comes back on.
#
# This matters well beyond the IMU itself. It is the SECOND DEVICE ON THE SAME
# I2C BUS, and therefore the only control this project has: if the LSM6DSV
# answers at 0x6B and the VL53L9CX does not at 0x29, the bus, the pull-ups, the
# pinctrl and the bitrate are all proven and the fault is unambiguously on the
# ToF side. Without it, every NAK has two possible explanations and the log has
# been saying so.
CONFIG_APP_ENABLE_IMU=y

# The VL53L9CX driver models SUSPEND and TURN_OFF as distinct PM actions, which
# is the whole point of the stage-4 energy work. Without PM_DEVICE they collapse
# and the driver will not build.
CONFIG_PM_DEVICE=y
# CONFIG_VL53L9CX_LOG_LEVEL_INF — turned down to WRN at the end of this
# file while the radio is being debugged. Put it back afterwards.

# A 12x10 frame is 880 bytes on the wire; the driver keeps one 14,842-byte raw
# buffer for the worst case, and the application one ~18 KB struct. Both static,
# so the main stack does not need to grow.

# Memory protection off (Victor, 2026-09-04).
#
# Set here rather than in the board defconfig so the board file stays Victor's
# and the choice travels with the application that wants it. prj.conf overrides
# the board default, so CONFIG_ARM_MPU=y there loses to this.
#
# HW_STACK_PROTECTION goes with it, not as an extra opinion: it is implemented
# using the MPU, so leaving it on with the MPU off is an unsatisfiable
# combination rather than a stricter one.
#
# What this costs, so it is a decision rather than a default: a stack overflow
# now corrupts adjacent memory silently instead of faulting at the moment it
# happens. On a build that will carry a 14.8 KB frame buffer and a 9.8 KB
# firmware blob, that is the failure it was most likely to have caught. Worth
# turning back on if anything starts behaving inexplicably.
# Stacks, sized for immediate-mode logging.
#
# THIS IS THE 2026-09-07 CRASH. CONFIG_LOG_MODE_IMMEDIATE formats each message
# on the CALLING thread's stack, and this driver's bring-up messages are long -
# several are 150-250 characters with multiple arguments. The main thread had
# the 1024-byte default, and the retry path runs the whole verbose ladder on it.
#
# It did not show up before because the messages were being DROPPED: the RTT
# backend had latched host_present=false, so nothing was ever formatted. Fixing
# the logging is what exposed it. The fault - "Illegal load of EXC_RETURN into
# PC", pc=0x0000000a, reported against the IDLE thread - is the signature of one
# stack overflowing into its neighbour, which with the MPU off happens silently.
# A full 54x42 frame is 14,842 bytes, which is ~334 ms at 400 kHz. The nRF TWIM
# driver's default transfer timeout is 500 ms, so the read would have sat at 67%
# of its budget with nothing but bus overhead in reserve - and a timeout there
# triggers i2c_nrfx_twim_recover_bus(), which would present as a sensor fault
# rather than as the tight deadline it actually is.
CONFIG_I2C_NRFX_TRANSFER_TIMEOUT=2000

# 32 KB: one full-resolution grid is 8.9 KB and arrives as a burst.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=32768

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_IDLE_STACK_SIZE=512
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Memory protection stays OFF, as Victor asked on 2026-09-04.
#
# Note what that costs, since it cost us a day here: with the MPU off a stack
# overflow corrupts whatever is adjacent instead of faulting at the instruction
# that did it, so the crash surfaces somewhere unrelated - in this case in the
# idle thread, with a garbage PC. To get a named fault instead, tick the
# `stack-guard` snippet; it turns both back on and nothing else.
CONFIG_ARM_MPU=n
CONFIG_HW_STACK_PROTECTION=n

# ============================================================================
# AP_CLK is no longer generated by this SoC (Victor, 2026-09-11).
#
# CONFIG_VL53L9CX_HOLD_HFCLK was here to keep the GRTC fast-clock output alive
# across CPU sleep. With the board's own 12 MHz oscillator driving AP_CLK there
# is no output to keep alive, and holding the high-frequency domain would only
# contend with the Bluetooth controller, which manages HFXO for itself.
#
# It was already dead code — the driver's HFCLK request sits inside
# #if VL53L9CX_APCLK_FROM_GRTC, which is false once the overlay deletes
# clkout-fast-frequency-hz — but a Kconfig symbol saying the firmware holds the
# radio's clock, when it does not, is worse than no symbol. Removed.
#
# The option still exists in the driver's Kconfig for a board that does source
# AP_CLK from the SoC. This application is not one.

# ============================================================================
# Bisect control REMOVED 2026-09-11 — superseded.
#
# It existed to find which of five firmware changes broke ranging. The answer
# turned out not to be in firmware at all: the board's AP_CLK became 12 MHz
# while the devicetree still declared 8 MHz. The control run failing with ZERO
# shots per step is what ruled the firmware out, so it did its job.
#
# Normal configuration restored: exposure, DSS LUT and profile writes all on.

# ============================================================================
# FULL RESOLUTION — 54x42, the whole array. Victor, 2026-09-11.
#
# In prj.conf rather than as a build configuration, so a plain Build from the
# nRF Connect extension produces it. The Kconfig choice still defaults to
# 24x20; this line overrides it.
#
# Why now: 24x20 works. The 12 MHz declaration fixed AP_CLK, amplitude went
# from 9 to 126 and ambient from 13 to 1, and the device reports all clear. The
# previous 54x42 attempt (2026-09-10) timed out waiting for frame-ready, but
# that was against a sensor whose internal clocks were all 1.5x wrong, so it
# proved nothing about frame size.
#
# What full resolution costs, and every one of these is already provisioned:
#
#   raw frame     14,842 B  (fits VL53L9CX_RAW_BUF_MAX exactly)
#   bus time      ~334 ms at 400 kHz, against ~90 ms for 24x20
#   I2C timeout   2000 ms, so the read sits at ~17% of its budget
#   grid log      42 rows x 216 chars = ~9 KB per capture, every 5 s, into a
#                 32 KB RTT buffer
#   RAM           unchanged: struct vl53l9cx_frame and data->raw are both
#                 sized for VL53L9CX_ZONES_FULL whatever this is set to
#
# THE PREDICTION TO CHECK AGAINST THE LOG. Binning goes 4 -> 2, so each zone
# is built from a quarter as many SPADs and per-zone amplitude should fall by
# roughly 4x: ~126 at 24x20 becomes ~32 here. That is the number the expert
# review asked for - whether full resolution has any SNR left at all - and the
# amplitude split is printed on every frame.
#
# Exposure deliberately stays at 4 ms. One variable at a time: 4 ms was chosen
# to cure saturation at 24x20, and a 4x drop in per-zone signal may cure it by
# itself. Let the amplitude split say which way to move before touching it.
CONFIG_APP_TOF_RES_54X42=y

# ============================================================================
# BLE — phases 1-5 of docs/plan/ble-streaming-and-web-ui.md.
#
# The web interface is Chrome + Web Bluetooth, so the numbers below are chosen
# against what Chrome actually negotiates on desktop: MTU 247, 2M PHY, and a
# data length of 251. Every one of them is logged on connect rather than
# assumed, because the fragment count per frame follows the MTU and a central
# that stays at the 23-byte default turns a 4,536-byte frame into 227
# notifications instead of 19.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME="water-sense-tof"

# No pairing, no bonding. A research node broadcasting occupancy in the clear is
# a DECISION (plan section 12) rather than an oversight, and it belongs in the
# paper as one. It also keeps the browser out of the pairing dialogs, which are
# the least reliable part of Web Bluetooth.
CONFIG_BT_SMP=n

# Throughput. The frame service is the only thing on this node that can
# saturate a link, so these are sized for it rather than left at defaults.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_ATT_TX_COUNT=10
# The host asserts at compile time that event RX buffers outnumber ACL TX
# buffers — every ACL TX can generate a number-of-completed-packets event, and
# a controller with nowhere to report completion deadlocks the link rather than
# slowing it. Raising ACL TX for throughput obliges raising this with it.
CONFIG_BT_BUF_EVT_RX_COUNT=12

# The CONTROLLER's buffers, which are a separate pool from the host's above.
# Without these it reported, in its own words:
#
#   <wrn> bt_hci_core: Num of Controller's ACL packets != ACL bt_conn_tx
#                      contexts (3 != 10)
#
# Ten host contexts queued behind three controller packets is not ten-deep
# pipelining; it is three, with seven contexts waiting. For a service whose
# whole job is pushing 19-62 notifications per frame, that is the difference
# between a full link and a third of one.
CONFIG_BT_CTLR_SDC_TX_PACKET_COUNT=10
CONFIG_BT_CTLR_SDC_RX_PACKET_COUNT=4

# 2M PHY doubles the on-air rate. USER_PHY_UPDATE is what makes
# bt_conn_le_phy_update() available to the application and enables the
# le_phy_updated callback that reports what the central actually agreed to.
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y

# ============================================================================
# TEMPORARY — 2026-09-11. Watching the HCI exchange, because inference has run
# out of road.
#
# What is established: the radio WORKS. The receive self-test heard 77-89
# advertisements at -40 dBm, and BLE cannot be demodulated with the carrier
# 50 ppm out or with no antenna — so the crystal, the RF path and MPSL's radio
# scheduling are all proven. bt_le_adv_start() returns 0, TX power is 0 dBm,
# BROADCASTER and PERIPHERAL are both set, and no scanner sees the node.
#
# Every remaining guess is about what the host actually tells the controller,
# so stop guessing and read it. zephyr/subsys/bluetooth/host/adv.c logs under
# CONFIG_BT_HCI_CORE_LOG_LEVEL, so this one symbol gives both the advertising
# path and the HCI command/status for LE Set Advertising Parameters, LE Set
# Advertising Data and LE Set Advertising Enable.
#
# REMOVE BOTH LINES once the node is visible. The first is loud; the second
# silences a sensor that is working, and that is only acceptable while the
# radio is the question.
CONFIG_BT_HCI_CORE_LOG_LEVEL_DBG=y

# The driver's bring-up ladder runs at POST_KERNEL, BEFORE main() and before
# BLE, and it is several kilobytes. Zephyr's RTT backend latches
# host_present=false once a write exhausts its retries and then drops
# everything silently — which has already eaten the driver ladder twice in this
# session. Turning the driver down is what keeps the BLE debug above from
# meeting the same fate.
CONFIG_VL53L9CX_LOG_LEVEL_WRN=y
