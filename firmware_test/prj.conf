# Board bring-up test: prove the MCU runs and can talk to us.

# Console over SEGGER RTT. No UART pins are assigned on this board, and RTT
# works over the J-Link that is attached for flashing anyway — so this costs no
# pins and no board changes.
#
# To watch it:  west build ... && west flash && JLinkRTTViewer
# (or `west attach` / `JLinkRTTLogger` — anything that opens RTT channel 0)
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n

CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
# Immediate mode: log lines appear as they happen rather than via a deferred
# thread. Slower, and exactly what is wanted when the question is "does it get
# this far before it dies".
CONFIG_LOG_MODE_IMMEDIATE=y

# RTT must not drop messages during bring-up.
#
# The 2026-09-06 capture lost the whole I2C probe: the log cut off mid-line at
# 502 ms and resumed at heartbeat 2, 5.2 seconds later. That is the default
# 1 KB up-buffer overflowing against RTT's default drop-on-full, and the
# messages it ate were the ones that say whether the sensor answered.
#
# Block instead of dropping, and give it room. The block is bounded — RETRY_CNT
# attempts RETRY_DELAY_MS apart, then it gives up — so a board running with no
# viewer attached stalls for at most 20 ms per message rather than forever.
CONFIG_LOG_BACKEND_RTT_MODE_BLOCK=y
CONFIG_LOG_BACKEND_RTT_RETRY_CNT=4
CONFIG_LOG_BACKEND_RTT_RETRY_DELAY_MS=5
# SEGGER_RTT_BUFFER_SIZE_UP is the one that matters: the RTT backend uses
# buffer 0, the console buffer, so LOG_BACKEND_RTT_BUFFER_SIZE does not apply.
# 16 KB, not 4 KB. The failing bring-up ladder emits several kilobytes in one
# burst at POST_KERNEL, and Zephyr's RTT backend latches host_present=false once
# a write exhausts its retries (log_backend_rtt.c:178-186), after which every
# subsequent message is dropped instantly and silently. A bigger buffer makes
# that less likely; it does not make it impossible, which is why the real fix is
# vl53l9cx_retry_boot() from main() rather than any amount of tuning here.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=16384

CONFIG_GPIO=y

# I2C, shared by the LSM6DSV..BX IMU at 0x6B and the VL53L9CX at 0x29.
CONFIG_I2C=y

# The IMU is not fitted at the moment (Victor, 2026-09-05). Set back to y when
# it is — the code stays compiled-out rather than deleted.
#
# Note what this costs: the IMU was the only other device on this bus, so while
# it answered it proved the bus independently of the VL53L9CX. With it gone, a
# silent ToF sensor could be a bus fault just as easily as a sensor fault.
CONFIG_APP_ENABLE_IMU=n

# The VL53L9CX driver models SUSPEND and TURN_OFF as distinct PM actions, which
# is the whole point of the stage-4 energy work. Without PM_DEVICE they collapse
# and the driver will not build.
CONFIG_PM_DEVICE=y
CONFIG_VL53L9CX_LOG_LEVEL_INF=y

# A 12x10 frame is 880 bytes on the wire; the driver keeps one 14,842-byte raw
# buffer for the worst case, and the application one ~18 KB struct. Both static,
# so the main stack does not need to grow.

# Memory protection off (Victor, 2026-09-04).
#
# Set here rather than in the board defconfig so the board file stays Victor's
# and the choice travels with the application that wants it. prj.conf overrides
# the board default, so CONFIG_ARM_MPU=y there loses to this.
#
# HW_STACK_PROTECTION goes with it, not as an extra opinion: it is implemented
# using the MPU, so leaving it on with the MPU off is an unsatisfiable
# combination rather than a stricter one.
#
# What this costs, so it is a decision rather than a default: a stack overflow
# now corrupts adjacent memory silently instead of faulting at the moment it
# happens. On a build that will carry a 14.8 KB frame buffer and a 9.8 KB
# firmware blob, that is the failure it was most likely to have caught. Worth
# turning back on if anything starts behaving inexplicably.
# Stacks, sized for immediate-mode logging.
#
# THIS IS THE 2026-09-07 CRASH. CONFIG_LOG_MODE_IMMEDIATE formats each message
# on the CALLING thread's stack, and this driver's bring-up messages are long -
# several are 150-250 characters with multiple arguments. The main thread had
# the 1024-byte default, and the retry path runs the whole verbose ladder on it.
#
# It did not show up before because the messages were being DROPPED: the RTT
# backend had latched host_present=false, so nothing was ever formatted. Fixing
# the logging is what exposed it. The fault - "Illegal load of EXC_RETURN into
# PC", pc=0x0000000a, reported against the IDLE thread - is the signature of one
# stack overflowing into its neighbour, which with the MPU off happens silently.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_IDLE_STACK_SIZE=512
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Memory protection stays OFF, as Victor asked on 2026-09-04.
#
# Note what that costs, since it cost us a day here: with the MPU off a stack
# overflow corrupts whatever is adjacent instead of faulting at the instruction
# that did it, so the crash surfaces somewhere unrelated - in this case in the
# idle thread, with a garbage PC. To get a named fault instead, tick the
# `stack-guard` snippet; it turns both back on and nothing else.
CONFIG_ARM_MPU=n
CONFIG_HW_STACK_PROTECTION=n

# ============================================================================
# TEMPORARY — AP_CLK always on, for the bench test of 2026-09-07.
#
# REMOVE THIS BEFORE ANY ENERGY MEASUREMENT. It holds the HFXO on continuously
# and never releases it, so idle current under this build is meaningless for
# the A/B in docs/plan/ap-clk-always-on.md.
#
# Why it is here rather than in the apclk-always-on snippet: Victor asked for it
# in the code, so that plain Build produces the always-on firmware with no build
# configuration to remember. The snippet still exists and still works; while
# this line is present the snippet simply makes no difference.
#
# What it does: engages the SECOND clock-holding mechanism, alongside the GRTC
# SYSCOUNTER ACTIVE request the driver always makes. The 2026-09-06 reasoning
# for that request is unproven — CLKOUT_FAST divides the GRTC hfclock while
# SYSCOUNTER.CLKCFG selects among low-frequency sources — so this test holds
# both and lets the scope decide. The three possible readings are written down
# in docs/plan/ap-clk-always-on.md.
#
# Scope of effect: NONE on the X-NUCLEO build. The code it enables is nested
# inside #if VL53L9CX_APCLK_FROM_GRTC, which is false when the x-nucleo snippet
# deletes clkout-fast-frequency-hz. It changes only builds where the SoC itself
# generates AP_CLK — i.e. the custom water_sense_board.
#
# To revert: delete this block. One line, one commit.
CONFIG_VL53L9CX_HOLD_HFCLK=y
