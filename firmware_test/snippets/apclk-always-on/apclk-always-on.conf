# Hold the high-frequency clock domain on, and never release it.
#
# The driver already requests GRTC SYSCOUNTER ACTIVE unconditionally when the
# SoC generates AP_CLK. This adds the second, independent mechanism: the HFXO
# is started at boot and the reference is never dropped, so the divider that
# produces the 8 MHz always has something to divide.
#
# Requires the `clock` node, which the application overlay already enables.
CONFIG_VL53L9CX_HOLD_HFCLK=y

# Log everything at INF so the clock lines are all visible in one capture.
CONFIG_VL53L9CX_LOG_LEVEL_INF=y
